<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 7: Notes SPA (React.js)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel standalone for JSX in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- React Root Mount Point -->
    <div id="root"></div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- React Component Application Logic -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        function NotesApp() {
            // Initial sample notes or read from localStorage
            const [notes, setNotes] = useState(() => {
                const saved = localStorage.getItem('exp7_notes');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) {}
                }
                return [
                    {
                        id: 1,
                        title: "Data Science Roadmap",
                        content: "Master NumPy, Pandas, Matplotlib, and scikit-learn for ML.",
                        category: "Study",
                        date: "Nov 16, 2026"
                    },
                    {
                        id: 2,
                        title: "Suryascope Next Steps",
                        content: "Refine solar rooftop polygon boundary marking algorithm.",
                        category: "Project",
                        date: "Nov 16, 2026"
                    }
                ];
            });

            // Form state for Add / Update
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');
            const [category, setCategory] = useState('Study');
            const [editingId, setEditingId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');

            // Sync with localStorage
            useEffect(() => {
                localStorage.setItem('exp7_notes', JSON.stringify(notes));
            }, [notes]);

            // Handle Add or Update Note
            const handleSubmit = (e) => {
                e.preventDefault();
                if (!title.trim() || !content.trim()) return;

                if (editingId !== null) {
                    // Update existing note
                    setNotes(notes.map(note => 
                        note.id === editingId 
                            ? { ...note, title: title.trim(), content: content.trim(), category, date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) }
                            : note
                    ));
                    setEditingId(null);
                } else {
                    // Create new note
                    const newNote = {
                        id: Date.now(),
                        title: title.trim(),
                        content: content.trim(),
                        category,
                        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
                    };
                    setNotes([newNote, ...notes]);
                }

                // Reset form
                setTitle('');
                setContent('');
                setCategory('Study');
            };

            // Start editing a note
            const handleEdit = (note) => {
                setEditingId(note.id);
                setTitle(note.title);
                setContent(note.content);
                setCategory(note.category);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // Cancel edit
            const handleCancelEdit = () => {
                setEditingId(null);
                setTitle('');
                setContent('');
                setCategory('Study');
            };

            // Delete a note
            const handleDelete = (id) => {
                if (window.confirm("Are you sure you want to delete this note?")) {
                    setNotes(notes.filter(note => note.id !== id));
                    if (editingId === id) {
                        handleCancelEdit();
                    }
                }
            };

            // Filtered notes based on search query
            const filteredNotes = notes.filter(note => 
                note.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                note.content.toLowerCase().includes(searchQuery.toLowerCase()) ||
                note.category.toLowerCase().includes(searchQuery.toLowerCase())
            );

            return (
                <div className="container py-5">
                    {/* Header */}
                    <div className="text-center mb-5">
                        <span className="badge bg-primary px-3 py-2 rounded-pill mb-2">React.js Single-Page Application</span>
                        <h1 class="display-6 fw-bold text-dark"><i className="bi bi-journal-check text-primary me-2"></i>Notes Manager SPA</h1>
                        <p className="text-secondary">View, Add, Update, and Delete notes dynamically with state management</p>
                    </div>

                    <div className="row g-4">
                        {/* Note Form Section (Col-lg-4) */}
                        <div className="col-lg-4">
                            <div className="card shadow-sm border-0 sticky-top" style={{ top: '20px' }}>
                                <div className={`card-header text-white ${editingId ? 'bg-warning text-dark' : 'bg-primary'}`}>
                                    <h5 className="mb-0 fw-bold">
                                        <i className={`bi ${editingId ? 'bi-pencil-square' : 'bi-plus-circle'} me-2`}></i>
                                        {editingId ? 'Update Note' : 'Add New Note'}
                                    </h5>
                                </div>
                                <div className="card-body p-4">
                                    <form onSubmit={handleSubmit}>
                                        <div className="mb-3">
                                            <label className="form-label fw-semibold">Note Title</label>
                                            <input 
                                                type="text" 
                                                className="form-control" 
                                                placeholder="e.g. C++ OOP Concepts" 
                                                value={title} 
                                                onChange={(e) => setTitle(e.target.value)} 
                                                required 
                                            />
                                        </div>

                                        <div className="mb-3">
                                            <label className="form-label fw-semibold">Category</label>
                                            <select 
                                                className="form-select" 
                                                value={category} 
                                                onChange={(e) => setCategory(e.target.value)}
                                            >
                                                <option value="Study">Study</option>
                                                <option value="Project">Project</option>
                                                <option value="Personal">Personal</option>
                                                <option value="Ideas">Ideas</option>
                                            </select>
                                        </div>

                                        <div className="mb-3">
                                            <label className="form-label fw-semibold">Content</label>
                                            <textarea 
                                                className="form-control" 
                                                rows="4" 
                                                placeholder="Write your note details here..." 
                                                value={content} 
                                                onChange={(e) => setContent(e.target.value)} 
                                                required
                                            ></textarea>
                                        </div>

                                        <div className="d-grid gap-2">
                                            <button type="submit" className={`btn ${editingId ? 'btn-warning' : 'btn-primary'}`}>
                                                <i className={`bi ${editingId ? 'bi-check2' : 'bi-save'} me-1`}></i>
                                                {editingId ? 'Save Changes' : 'Create Note'}
                                            </button>
                                            {editingId && (
                                                <button type="button" className="btn btn-outline-secondary" onClick={handleCancelEdit}>
                                                    Cancel Edit
                                                </button>
                                            )}
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                        {/* Notes List Section (Col-lg-8) */}
                        <div className="col-lg-8">
                            {/* Search and Stats Bar */}
                            <div className="card border-0 shadow-sm p-3 mb-4">
                                <div className="row g-2 align-items-center">
                                    <div className="col-md-7">
                                        <div className="input-group">
                                            <span className="input-group-text bg-white"><i className="bi bi-search"></i></span>
                                            <input 
                                                type="text" 
                                                className="form-control border-start-0" 
                                                placeholder="Search notes by title or content..." 
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}
                                            />
                                        </div>
                                    </div>
                                    <div className="col-md-5 text-md-end text-muted small">
                                        Showing <strong>{filteredNotes.length}</strong> of <strong>{notes.length}</strong> notes
                                    </div>
                                </div>
                            </div>

                            {/* Cards Grid */}
                            {filteredNotes.length === 0 ? (
                                <div className="card border-0 shadow-sm p-5 text-center text-muted">
                                    <i className="bi bi-clipboard-x display-3 mb-3 text-secondary"></i>
                                    <h5>No Notes Found</h5>
                                    <p className="mb-0">Create your first note using the form on the left or try another search query.</p>
                                </div>
                            ) : (
                                <div className="row g-3">
                                    {filteredNotes.map(note => (
                                        <div className="col-md-6" key={note.id}>
                                            <div className="card h-100 border-0 shadow-sm note-card">
                                                <div className="card-body d-flex flex-column">
                                                    <div className="d-flex justify-content-between align-items-start mb-2">
                                                        <span className={`badge ${
                                                            note.category === 'Project' ? 'bg-primary' :
                                                            note.category === 'Study' ? 'bg-success' :
                                                            note.category === 'Personal' ? 'bg-warning text-dark' : 'bg-secondary'
                                                        }`}>
                                                            {note.category}
                                                        </span>
                                                        <small className="text-muted">{note.date}</small>
                                                    </div>
                                                    <h5 className="card-title fw-bold text-dark">{note.title}</h5>
                                                    <p className="card-text text-secondary flex-grow-1" style={{ whiteSpace: 'pre-wrap' }}>
                                                        {note.content}
                                                    </p>
                                                    <div className="d-flex justify-content-end gap-2 pt-3 border-top mt-2">
                                                        <button 
                                                            className="btn btn-outline-primary btn-sm" 
                                                            onClick={() => handleEdit(note)}
                                                            title="Edit note"
                                                        >
                                                            <i className="bi bi-pencil me-1"></i>Edit
                                                        </button>
                                                        <button 
                                                            className="btn btn-outline-danger btn-sm" 
                                                            onClick={() => handleDelete(note.id)}
                                                            title="Delete note"
                                                        >
                                                            <i className="bi bi-trash me-1"></i>Delete
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NotesApp />);
    </script>
</body>
</html>
